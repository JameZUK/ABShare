<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data saver spike</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<h1>Data saver spike</h1>
<p class="note">Phase 0 test page. LAN only. Other tests: <a href="offline.html">offline</a> · <a href="passkey.html">passkeys</a></p>
<fieldset class="row">
  <legend>Quality</legend>
  <label><input type="radio" name="src" value="media?q=32" checked> 32 kb/s</label>
  <label><input type="radio" name="src" value="media?q=40"> 40 kb/s</label>
  <label><input type="radio" name="src" value="media?q=48"> 48 kb/s</label>
  <label><input type="radio" name="src" value="original"> Original</label>
</fieldset>
<audio id="player" preload="metadata"></audio>
<label class="scrub">Position (seeks when you let go)
  <input id="scrub" type="range" min="0" max="1000" step="1" value="0">
</label>
<p id="status">Not started</p>
<div class="row">
  <button id="back">−30 s</button>
  <button id="play">Play / pause</button>
  <button id="fwd">+30 s</button>
</div>
<div class="row">
  <button data-frac="0.25">25 %</button>
  <button data-frac="0.5">50 %</button>
  <button data-frac="0.9">90 %</button>
  <button data-frac="0.999">End</button>
  <button id="random">Random</button>
</div>
<h2>Events</h2>
<ol id="log" reversed></ol>
</body>
</html>
