# ABShare behind nginx. Replace books.example.com, the certificate paths and the upstream.
# Keep the X-Forwarded-* lines exactly: ABShare trusts only the proxy named in
# trusted_proxies, and only when it overwrites (never appends to) these headers.
# No Content-Security-Policy here: ABShare sends its own, and a second one would conflict.

upstream abshare {
    server 10.0.0.20:8743;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name books.example.com;

    ssl_certificate     /etc/nginx/ssl/books.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/books.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Small bodies only: the API never takes more.
    client_max_body_size 64k;
    client_header_timeout 15s;
    client_body_timeout 15s;

    # Shared by both locations.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: ABShare reads the client address from this hop only.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;

    # The app and the API: nginx reads each request whole before passing it on, so a client
    # trickling a request can't hold ABShare's connections.
    location / {
        proxy_pass http://abshare;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }

    # Audio: stream straight through, Range requests unchanged, never spooled to disk.
    location /v1/media/ {
        proxy_pass http://abshare;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
