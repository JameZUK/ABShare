# CI deploy test (SPEC §11 Phase 5 gate): the release image behind nginx with TLS.
# Run by deploy/ci/run.sh; see deploy/ci/test.py for what is checked.
networks:
  ci:
    ipam:
      config:
        - subnet: 10.89.0.0/24

services:
  abshare:
    image: abshare:ci
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    command: ["serve", "--config", "/etc/abshare/abshare.toml"]
    volumes:
      - ./work/library:/library:ro
      - ./work/data:/data
      - ./abshare.toml:/etc/abshare/abshare.toml:ro
    networks:
      ci:
        ipv4_address: 10.89.0.20

  nginx:
    image: nginx:1.27.3-alpine
    depends_on: [abshare]
    ports: ["127.0.0.1:8080:80", "127.0.0.1:8443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./work/certs:/etc/nginx/ssl:ro
    networks:
      ci:
        ipv4_address: 10.89.0.10
