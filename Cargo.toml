[workspace]
resolver = "3"
members = ["core", "jail", "server", "tools/saver-spike"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

# Password hashing is deliberately expensive; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
