[workspace]
resolver = "3"
members = ["core", "jail", "tools/saver-spike"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
