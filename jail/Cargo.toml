[package]
name = "abshare-jail"
description = "Runs one program under Landlock, seccomp and rlimits (ffmpeg sandbox for ABShare)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "abshare-jail"
path = "src/main.rs"

[dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
rustix = { version = "1.1.5", features = ["process"] }
libc = "0.2"

# Test helper for the escape tests (tests/escape.rs); not installed.
[[bin]]
name = "abshare-jail-probe"
path = "src/bin/probe.rs"
test = false
doc = false

[lints]
workspace = true
