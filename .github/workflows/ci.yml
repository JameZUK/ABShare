name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: ffmpeg and sqlite for the scanner tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg sqlite3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The jail needs Landlock ABI 6 (Linux 6.12+). Hosted runners may run older kernels, so the
      # escape tests skip here when the jail cannot start; they are required (and run) on
      # development machines and on the deployment target via ABSHARE_REQUIRE_LANDLOCK=1.
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Type check (strict, warnings fail)
        run: npm run check
      - name: Unit tests and the HTML-injection source scan
        run: npm test
      - name: "Build (fails on any inline script, on* attribute or javascript: URL)"
        run: npm run build

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz@0.13.2 --locked
      - name: Each fuzz target for 60 seconds
        working-directory: fuzz
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run -O "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t abshare:ci .
      - name: Deploy test (the image behind nginx with TLS)
        run: deploy/ci/run.sh
      - name: Image scan (high and critical, with fixes available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: abshare:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: systemd units stay hardened (exposure 1.5 or less)
        run: |
          for u in deploy/abshare.service deploy/abshare-scan.service; do
            systemd-analyze security --offline=yes --threshold=15 "$u" > out.txt || { cat out.txt; exit 1; }
            tail -1 out.txt
          done
      - name: The image runs as non-root and its binaries are present
        run: |
          test "$(docker inspect -f '{{.Config.User}}' abshare:ci)" = "65534:65534"
          docker run --rm --entrypoint /usr/local/bin/abshare-jail abshare:ci 2>&1 | grep -q "usage: abshare-jail"
          docker run --rm --entrypoint /bin/sh abshare:ci -c 'test -f /usr/share/abshare/web/index.html && test -f /usr/share/abshare/web/service-worker.js'
